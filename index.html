<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperaturas</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="card">
        <h1 class="title">
            Conversor de Temperatura
        </h1>
        <div class="form">
            <label>Temperatura en Celcius:</label>
            <input type="text" placeholder="Ingresa una temperatura" id="temp-celcius">
        </div>
        <button class="btn-converter" id="btn-converter">
            Convertir
        </button>

        <div class="result-container" id="result-container"></div>
    </section>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
